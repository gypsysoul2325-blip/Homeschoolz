<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d4aff"><title>Kat's School Home</title><style>:root{--p:#6d4aff;--bg:#f7f5ff;--card:#fff;--t:#29243d;--m:#716b84;--line:#e8e2f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(135deg,#6d4aff,#8d72ff);color:white;padding:24px 18px;border-radius:0 0 24px 24px}.wrap{max-width:760px;margin:auto;padding:14px}h1{margin:0;font-size:28px}h2{margin:5px 0 8px}.sub{opacity:.9}.nav{display:flex;gap:8px;overflow:auto;padding:10px 0}.nav button,.btn{border:0;border-radius:14px;padding:11px 14px;background:#fff;font-weight:700;color:var(--t);box-shadow:0 2px 9px #0001}.nav .on{background:var(--p);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.course{cursor:pointer}.course b{display:block;font-size:17px}.pill{display:inline-block;background:#eee9ff;color:#5637c9;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;margin-top:6px}.muted{color:var(--m)}.lesson{padding:12px 0;border-top:1px solid var(--line)}label{display:flex;gap:10px;font-weight:700}input{width:21px;height:21px;accent-color:var(--p)}.progress{height:9px;background:#ece8f5;border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--p)}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><h1>📚 Kat's School Home</h1><div class="sub">Presley • 11th Grade • 2026–2027</div></div></header><div class="wrap"><div class="nav"><button class="on" onclick="home(this)">🏠 Home</button><button onclick="courses(this)">📚 Courses</button><button onclick="calendar(this)">📅 Calendar</button><button onclick="parent(this)">👩‍🏫 Parent</button></div><main id="app"></main></div><script>
const A='kats_school_v1_';const courseNames=[['English','Fences'],['Chemistry','Chemistry'],['Social Studies','World History'],['Math','Math / GED Readiness'],['Art','Art & Visual Design'],['Music','11th-Grade Music'],['PE','Physical Education'],['Biblical Studies','Biblical Studies'],['Career / Welding','Career & Welding']];
const english=[
['1','Introduction to Reading Plays','October 1, 2026',['Learn: How to Read a Play','Practice: Read & Analyze a Short Scene','Apply: Play vs. Novel','Unit Check: How to Read a Play Guide']],
['2','Fences: Entering the Play','October 14, 2026',['Read & Annotate: Opening Scenes','Character Study: Troy','Conflict & Relationships','Written Response: Introducing Troy']],
['3','Fences: Family, Dreams & Responsibility','October 28, 2026',['Read & Track Relationships','Symbol Study: The Fence','Theme Exploration','Evidence Paragraph']],
['4','Fences: Act 1 Analysis','November 11, 2026',['Read & Annotate: Turning Point','Dramatic Structure','Character Comparison','Act 1 Literary Analysis']],
['5','Fences: Act 2','November 25, 2026',['Read & Track Change','Symbolism & Motifs','Perspective & Motivation','Short Literary Analysis']],
['6','Fences: Ending, Consequences & Themes','December 9, 2026',['Finish Reading & Reflect','Ending Analysis','Theme & Symbol Synthesis','Final Response Plan']],
['7','Fences: Literary Analysis Essay','December 23, 2026',['Draft Introduction','Draft Body Analysis','Revise & Edit','Final Literary Analysis']],
['8','Fences: Portfolio & Deeper Analysis','January 6, 2027',['Select & Organize Portfolio Evidence','Compare Two Interpretations','Author’s Craft Reflection','Portfolio Check']],
['9','Fences: Independent Application','January 20, 2027',['Close Reading Practice','Evidence & Citation Practice','Independent Analysis','Revision Workshop']],
['10','Fences: Final Course Project','February 3, 2027',['Final Project Proposal','Research/Context Connection','Final Presentation or Creative Adaptation','Course Reflection']]];
const detail={
'Learn: How to Read a Play':'Read the lesson notes on drama. Learn act, scene, dialogue, stage directions, setting, characterization, and conflict. Write short definitions. Then write 2–3 sentences explaining how a play differs from a novel.',
'Practice: Read & Analyze a Short Scene':'Read the assigned short scene. Mark stage directions. Identify the characters and setting. State the main conflict. Choose one line and explain what it reveals. Use evidence from the scene rather than guesses.',
'Apply: Play vs. Novel':'Think about The Great Gatsby. Explain one way a novel can use direct narration and one way a play must show information through dialogue or action. Give one example of each.',
'Unit Check: How to Read a Play Guide':'Create a one-page English-binder reference sheet covering acts/scenes, dialogue, stage directions, characterization, setting, conflict, and dramatic structure. Add a short example or reminder for each.'};
function nav(btn){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));btn.classList.add('on')}
function home(b){nav(b);app.innerHTML='<div class="card"><h2>Welcome to School Home 📚</h2><p>This app is only for Presley’s homeschool. We will build each course from the finalized PDFs, one course at a time.</p><span class="pill">11th Grade</span> <span class="pill">2026–2027</span></div><div class="card"><h2>What’s inside</h2><p>📚 Courses • 📅 School calendar • ✅ Assignment tracking • 📂 Portfolio • 🚌 Field trips • 🎓 GED readiness • 🔧 Career/Welding • 👩‍🏫 Parent/Teacher</p></div><div class="card"><h2>First course</h2><p><b>English — Fences</b> is the first course being locked in from the corrected master PDF.</p><button class="btn" onclick="openCourse('English')">Open English</button></div>'}
function courses(b){nav(b);app.innerHTML='<h2>Presley’s Courses</h2><div class="grid">'+courseNames.map(c=>'<div class="card course" onclick="openCourse(\''+c[0]+'\')"><b>'+c[0]+'</b><span class="muted">'+c[1]+'</span><br><span class="pill">10 units</span></div>').join('')+'</div>'}
function openCourse(n){if(n!=='English'){app.innerHTML='<div class="card"><h2>'+n+'</h2><p class="muted">Course shell only for now.</p><p>We are not adding assignments from memory or an older PDF. This course will be filled when we verify its finalized source.</p><button class="btn" onclick="courses(document.querySelector(\'.nav button:nth-child(2)\'))">← Courses</button></div>';return}let done=english.flatMap((u,i)=>u[3].map((x,j)=>localStorage.getItem(A+i+'-'+j)==='1')).filter(Boolean).length;app.innerHTML='<div class="card"><h2>English 11 — Fences</h2><p class="muted">Oct. 1, 2026–Feb. 16, 2027</p><p>Daily reading: <b>at least 15 minutes every day</b>.</p><div class="progress"><div class="bar" style="width:'+done/40*100+'%"></div></div><p class="muted">'+done+' of 40 assignments complete</p></div>'+english.map((u,i)=>'<div class="card"><h3>Unit '+u[0]+' — '+u[1]+'</h3><span class="pill">Deadline: '+u[2]+'</span>'+u[3].map((x,j)=>'<div class="lesson"><label><input type="checkbox" '+(localStorage.getItem(A+i+'-'+j)==='1'?'checked':'')+' onchange="localStorage.setItem(\''+A+i+'-'+j+'\',this.checked?\'1\':\'0\');openCourse(\'English\')"><span>'+x+'</span></label>'+(detail[x]?'<p class="muted">'+detail[x]+'</p>':'<p class="muted">Assignment details will be displayed here as the finalized course is expanded.</p>')+'</div>').join('')+'</div>').join('')}
function calendar(b){nav(b);app.innerHTML='<div class="card"><h2>📅 School Calendar</h2><p>School calendar will connect to the finalized schedule after the courses are locked.</p></div>'}
function parent(b){nav(b);app.innerHTML='<div class="card"><h2>👩‍🏫 Parent / Teacher</h2><p>Detailed parent guides, unit checks, portfolio review, and course notes will live here.</p><p class="muted">We will build this course-by-course from the finalized PDFs.</p></div>'}
home(document.querySelector('.nav button'));
</script></body></html>
